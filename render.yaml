services:
  - type: web
    name: technonexusacademy
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn web_project.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    autoDeploy: false
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: technonexusacademy.tech,www.technonexusacademy.tech
      - key: CSRF_TRUSTED_ORIGINS
        value: https://technonexusacademy.tech,https://www.technonexusacademy.tech
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "true"
      - key: DEFAULT_FROM_EMAIL
        value: noreply@technonexusacademy.tech
