services:
  - type: web
    name: technonexusacademy
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn web_project.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: technonexusacademy.tech,www.technonexusacademy.tech
      - key: CSRF_TRUSTED_ORIGINS
        value: https://technonexusacademy.tech,https://www.technonexusacademy.tech
      - key: DATABASE_URL
        sync: false
      - key: BREVO_SMTP_HOST
        value: smtp-relay.brevo.com
      - key: BREVO_SMTP_PORT
        value: "587"
      - key: BREVO_SMTP_USER
        sync: false
      - key: BREVO_SMTP_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: noreply@technonexusacademy.tech
      - key: SUPPORT_EMAIL
        value: support@technonexusacademy.tech
      - key: GOOGLE_CLIENT_ID
        value: 270348330205-tjehg7dmtigqmr1p55031mdems4gs8lf.apps.googleusercontent.com
